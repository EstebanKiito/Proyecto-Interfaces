<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorar - Plataforma Social de Música</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo"><a href="index.html">Biscuit</a></div>
      <nav>
        <ul>
          <li><a href="find.html">Explorar</a></li>
          <li><a href="#">Mi Perfil</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="search-section">
        <h1>Encuentra tu próximo álbum</h1>
        <input
          type="text"
          placeholder="Buscar álbum, artista o año..."
          class="search-bar"
        />
      </section>

      <section class="album-grid-section">
        <h2>Álbumes Populares Esta Semana</h2>
        <div class="album-grid">
          <article class="album-card">
            <a href="album-id.html">
              <img
                src="placeholder-dark-side.jpg"
                alt="The Dark Side of the Moon Cover"
                class="album-cover"
              />
              <h3 class="album-title">The Dark Side of the Moon</h3>
              <p class="album-artist">Pink Floyd</p>
            </a>
          </article>

          <article class="album-card">
            <img
              src="placeholder-cover2.jpg"
              alt="Cover 2"
              class="album-cover"
            />
            <h3 class="album-title">Abbey Road</h3>
            <p class="album-artist">The Beatles</p>
          </article>
          <article class="album-card">
            <img
              src="placeholder-cover3.jpg"
              alt="Cover 3"
              class="album-cover"
            />
            <h3 class="album-title">To Pimp A Butterfly</h3>
            <p class="album-artist">Kendrick Lamar</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
